[package]
name = "auth-app"
version = "0.1.0"
authors = ["pogodaev <pogodaev00@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
argon2 = { version = "0.6.0", features = ["password-hash"], optional = true }
dioxus = { version = "0.7.1", features = ["fullstack"] }
rusqlite = "0.41.1"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:argon2"]
